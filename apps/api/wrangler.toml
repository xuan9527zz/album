name = "family-album-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
[vars]
ALLOWED_ORIGINS = "https://xuan9527zz.github.io"
UPLOAD_TTL_SECONDS = "600"
READ_TTL_SECONDS = "300"
[secrets]
required = ["SUPABASE_URL", "SUPABASE_PUBLISHABLE_KEY", "SUPABASE_SECRET_KEY", "R2_ACCOUNT_ID", "R2_BUCKET_NAME", "R2_ACCESS_KEY_ID", "R2_SECRET_ACCESS_KEY"]
[triggers]
crons = ["17 */6 * * *"]

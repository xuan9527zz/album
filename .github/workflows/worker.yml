name: Deploy Worker
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    environment: album-production
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Worker was not deployed: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID for album-production.'
            echo '### Worker 未部署' >> "$GITHUB_STEP_SUMMARY"
            echo '缺少 Cloudflare 发布凭据。请设置 CLOUDFLARE_API_TOKEN secret 和 CLOUDFLARE_ACCOUNT_ID variable；也可在已登录 Wrangler 的本机运行 npm run deploy:api。现有线上版本不受影响。' >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: configuration
    if: needs.configuration.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: album-production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:api
      - run: npm run deploy:api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
